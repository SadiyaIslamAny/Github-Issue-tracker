<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <!-- tailwind & daisyUl Cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- font-awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- style -->
      <link rel="stylesheet" href="./style.css">
</head>
<body class= "bg-[#F8FAFC] min-h-screen overflow-x-hidden">
<div class="bg-white border border-[#E9E9E9]"> 

    <!-- navbar section-->
<section class="flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0 px-4 md:px-[80px] py-4">
    <!-- logo -->
     
     <div class="flex justify-start items-center gap-2">
      <img src="./assets/github-logo.png" alt="github-logo" class="w-[36px]">
      <h2 class="text-xl font-semibold">GitHub Issues Tracker</h2>
      </div>

        <!-- search input -->
   <div class="flex items-center gap-2">
    <label class="input rounded-md border border-gray-300 px-3 py-2
            focus-within:ring-2 focus-within:ring-purple-500 focus-within:border-purple-500 outline-none">
     <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    
        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
       </g>
     </svg>
      <input id="searchInput" type="search" required placeholder="Search" />
   </label>
   <!-- search button -->
     <button id="searchBtn" class="btn btn-primary text-[#FFFFFF]">
      <span>Search</span>
     </button>
    </div>
  </section>
</div>

<main class=" w-11/12 mx-auto ">
  <div class="bg-[#FFFFFF] border border-[#FFFFFF] justify-center mt-8">
     <div class="flex gap-2 mb-4 p-6">
      <button id="tabAll" onclick="filterIssues('all')"
        class="tab-active px-5 py-2 w-24 rounded text-sm font-semibold">All</button>
      <button id="tabOpen" onclick="filterIssues('open')"
        class="bg-white text-gray-600 px-5 py-2 w-24 rounded text-sm font-semibold border border-gray-200 hover:bg-gray-50">Open</button>
      <button id="tabClosed" onclick="filterIssues('closed')"
        class="bg-white text-gray-600 px-5 py-2 w-24 rounded text-sm font-semibold border border-gray-200 hover:bg-gray-50">Closed</button>
    </div>
</div>

<!-- issue section -->
<main class="mx-auto">
  <div class="bg-[#FFFFFF] border border-[#FFFFFF] mt-8 p-6 rounded-xl">

  <div class="flex justify-between items-center mb-6">
    <!-- Left Side -->
    <div class="flex gap-3 items-center">
      
      <div class="w-[40px] h-[40px] bg-[#ECE4FF] rounded-full flex items-center justify-center">
        <img src="./assets/Aperture.png" class="w-[27px] h-[27px]" alt="">
      </div>

      <div>
        <h2 class="text-xl font-semibold">
          <span id="total">0</span> Issues
        </h2>
        <p class="text-sm text-gray-500">
          Track and manage your project issues
        </p>
      </div>

    </div>

    <!-- Right Side -->
    <div class="flex gap-4 text-sm">

      <div class="flex items-center gap-2">
        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
        <span class="text-[16px] font-medium">Open</span>
      </div>

      <div class="flex items-center gap-2">
        <div class="w-3 h-3 bg-purple-500 rounded-full"></div>
        <span class="text-[16px] font-medium">Closed</span>
      </div>

    </div>
  </div>

  <hr class=" border-gray-300 mb-4">
  <div class="bg-[#FBFBFB]">
</body>
  <div id="issuesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 hidden"></div>
  <div id="noResults" class="hidden text-center py-16 text-gray-400">
    <p class="font-semibold">No issues found</p>
  </div>
  <div id="loader" class="flex justify-center items-center py-20">
      <span class="loading loading-spinner loading-lg text-primary"></span>
   </div> 
   </div>
  </div>
</main>
  <dialog id="issueModal" class="modal">
    <div class="modal-box max-w-2xl rounded-xl">
      <div id="modalLoader" class="flex justify-center py-10">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
      <div id="modalContent" class="hidden">
        <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-2"></h2>
        <div class="flex items-center gap-2 mb-3 flex-wrap">
          <span id="modalStatus"
            class="badge badge-success text-white px-3 py-1 rounded-full text-xs font-semibold"></span>
          <span class="text-gray-400 text-sm">•</span>
          <span id="modalAuthor" class="text-gray-500 text-sm"></span>
          <span class="text-gray-400 text-sm">•</span>
          <span id="modalDate" class="text-gray-500 text-sm"></span>
        </div>
        <div id="modalLabels" class="flex flex-wrap gap-2 mb-4"></div>
        <p id="modalDescription" class="text-gray-600 mb-5 leading-relaxed"></p>
        <div class="bg-gray-50 rounded-xl p-4 grid grid-cols-2 gap-4">
          <div>
            <p class="text-gray-400 text-sm mb-1">Assignee:</p>
            <p id="modalAssignee" class="font-semibold text-gray-800"></p>
          </div>
          <div>
            <p class="text-gray-400 text-sm mb-1">Priority:</p>
            <span id="modalPriority" class="badge px-3 py-1 text-xs font-bold"></span>
          </div>
        </div>
      </div>
      <div class="modal-action">
        <form method="dialog">
          <button class="btn btn-primary rounded-lg px-8">Close</button>
        </form>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog> 

  <script src="./home.js"></script>
</body>
</html>

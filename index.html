<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker</title>
    <!-- tailwind & daisyUl Cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- font-awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <!-- style -->
      <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center py-12">

  <div class="w-[420px] bg-[#FFFFFF] rounded-lg shadow py-8 px-2">
     <!-- logo, title,description -->
    <div class="flex flex-col items-center pt-4">
      <img src="./assets/github-logo.png" alt="github-logo" class="w-16 mb-3">

      <h2 class="text-xl font-semibold text-center">
        GitHub Issues Tracker
      </h2>

      <p class="text-gray-500 text-sm mt-1">
        Sign in to manage your issues
      </p>
    </div>

<!-- form container -->
  <div class="form">
    <div class="">
      <div class="card-body">
        <fieldset class="fieldset">
    <!-- User Input -->
       <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
     <input 
      id="username"
      type="text" 
      placeholder="Enter Username"
      class="w-full border border-gray-300 rounded-lg px-2 py-2 mb-1 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-[#F8FAFC]"
    >

    <p class="text-xs text-purple-600 mb-1">Default: admin</p>

    <!-- Password Input -->
    <label class="block text-sm font-medium text-gray-700 mb-1">
      Password
    </label>

    <input id="password" type="password" placeholder="Enter Password" class="w-full border border-gray-300 rounded-lg px-2 py-2 mb-1 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-[#F8FAFC]">

    <p class="text-xs text-purple-600 mb-1">Default: admin123</p>

    <!-- Button -->
    <button id="sign-in-btn" class="w-full btn btn-primary text-white py-2 rounded-lg font-medium hover:opacity-90">Sign In</button>

    </fieldset>
      </div>
    </div>
</div>
    <!-- OR -->
    <div class="flex items-center px-5">
      <hr class="flex-grow border-gray-300">
      <span class="mx-2 text-gray-400 text-sm">OR</span>
      <hr class="flex-grow border-gray-300">
    </div>

    <!-- Demo Credentials -->
  <div class="px-5">
    <p class="text-gray-500 mb-2 text-center">Demo Credentials:</p>
    <div class="bg-[#F8FAFC] py-3 rounded-lg text-center text-sm text-gray-700">
      <p><strong>Username:</strong> admin</p>
      <p><strong>Password:</strong> admin123</p>
    </div>
  </div>
  </div>

  <!-- js added -->
  <script src="./signin.js"></script>
</body>
</html>
